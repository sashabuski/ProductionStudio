<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Animated Multicolour Drop-Shadow Title</title>
  <style>
    :root{
      --bg: #000;
      --fg: #ff2a2a;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap{
      text-align:center;
      padding: 48px 24px;
    }

    h1{
      margin:0;
      font-size: clamp(48px, 8vw, 110px);
      letter-spacing: 0.06em;
      color: var(--fg);
      font-weight: 800;
      line-height: 1;
      /* a tiny crisp edge so the glow feels like it's behind */
      text-shadow: 0 0 1px rgba(0,0,0,.8);
    }

    /* This element is the "glow layer" behind the title */
    .glow{
      display:inline-block;
      /* keep it behind the text, but aligned perfectly */
      transform: translateZ(0);
      /* multicolour stacked drop-shadows */
      filter:
        drop-shadow(0 0 6px rgba(255, 0, 80, 0.95))
        drop-shadow(0 0 12px rgba(0, 255, 200, 0.75))
        drop-shadow(0 0 18px rgba(120, 0, 255, 0.70));
      animation: glowHue 3.2s linear infinite, glowPulse 1.8s ease-in-out infinite;
      will-change: filter, transform;
    }

    /* Cycle colours (swap the stacked shadow colours over time) */
    @keyframes glowHue{
      0%{
        filter:
          drop-shadow(0 0 6px rgba(255, 0, 80, 0.95))
          drop-shadow(0 0 12px rgba(0, 255, 200, 0.75))
          drop-shadow(0 0 18px rgba(120, 0, 255, 0.70));
      }
      33%{
        filter:
          drop-shadow(0 0 6px rgba(0, 255, 200, 0.95))
          drop-shadow(0 0 12px rgba(120, 0, 255, 0.75))
          drop-shadow(0 0 18px rgba(255, 200, 0, 0.70));
      }
      66%{
        filter:
          drop-shadow(0 0 6px rgba(120, 0, 255, 0.95))
          drop-shadow(0 0 12px rgba(255, 200, 0, 0.75))
          drop-shadow(0 0 18px rgba(255, 0, 80, 0.70));
      }
      100%{
        filter:
          drop-shadow(0 0 6px rgba(255, 0, 80, 0.95))
          drop-shadow(0 0 12px rgba(0, 255, 200, 0.75))
          drop-shadow(0 0 18px rgba(120, 0, 255, 0.70));
      }
    }

    /* Subtle “breathing” so it feels alive */
    @keyframes glowPulse{
      0%,100%{
        transform: scale(1);
      }
      50%{
        transform: scale(1.02);
      }
    }

    /* Optional: make the glow orbit slightly by offsetting each shadow over time */
    .orbit{
      animation: glowHue 3.2s linear infinite, orbit 2.4s ease-in-out infinite;
    }
    @keyframes orbit{
      0%{
        filter:
          drop-shadow(-6px 0 7px rgba(255, 0, 80, 0.90))
          drop-shadow(6px 0 12px rgba(0, 255, 200, 0.70))
          drop-shadow(0 6px 18px rgba(120, 0, 255, 0.65));
      }
      50%{
        filter:
          drop-shadow(6px 0 7px rgba(255, 0, 80, 0.90))
          drop-shadow(-6px 0 12px rgba(0, 255, 200, 0.70))
          drop-shadow(0 -6px 18px rgba(120, 0, 255, 0.65));
      }
      100%{
        filter:
          drop-shadow(-6px 0 7px rgba(255, 0, 80, 0.90))
          drop-shadow(6px 0 12px rgba(0, 255, 200, 0.70))
          drop-shadow(0 6px 18px rgba(120, 0, 255, 0.65));
      }
    }

    .hint{
      margin-top: 18px;
      color: rgba(255,255,255,.7);
      font-size: 14px;
      letter-spacing: .03em;
    }

    /* Respect reduced-motion */
    @media (prefers-reduced-motion: reduce){
      .glow, .orbit{ animation:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Toggle "orbit" class for moving/offset glow -->
    <span class="glow orbit">
      <h1>NEON PEAK</h1>
    </span>

    <div class="hint">Multicolour stacked <code>drop-shadow()</code> + animated colour cycling.</div>
  </div>
</body>
</html>
